# Backbones are candidate architectures; final selection requires validation evidence.
backbone: mobilenet_v3_small
dr_heads:
  dr_grade: 5
quality_heads:
  quality_grade: 2
# DeepDRiD verified binary overall_quality: 0 poor, 1 good.
