[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsart"
version = "0.2.0"
description = "Quality- and severity-aware retinal triage research prototype"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["qsart*", "api*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local real retinal images and trained checkpoints"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
