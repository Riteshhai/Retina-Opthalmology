services:
  api:
    build: .
    image: qsart:local
    ports:
      - "127.0.0.1:${QSART_API_PORT:-8000}:8000"
    environment:
      QSART_DR_CHECKPOINT: ${QSART_CONTAINER_DR_CHECKPOINT:-/checkpoints/dr/best.pt}
      QSART_QUALITY_CHECKPOINT: ${QSART_CONTAINER_QUALITY_CHECKPOINT:-/checkpoints/quality/best.pt}
      QSART_CALIBRATION: ${QSART_CONTAINER_CALIBRATION:-/checkpoints/calibration.json}
      QSART_MODEL_CARD: ${QSART_CONTAINER_MODEL_CARD:-/checkpoints/model_card.json}
      QSART_CPU_THREADS: "2"
    volumes:
      - ./checkpoints:/checkpoints:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  dashboard:
    image: qsart:local
    command: ["python", "-m", "streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "127.0.0.1:${QSART_DASHBOARD_PORT:-8501}:8501"
    environment:
      QSART_API_URL: http://api:8000
      QSART_REPORTS_DIR: /reports
      PYTHONPATH: /app
    volumes:
      - ./reports:/reports:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /home/qsart/.streamlit:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
