map $http_host $workspace_host_allowed {
    default 0;
    "~^(127\.0\.0\.1|localhost)(:[0-9]{1,5})?$" 1;
}

map "$request_method:$workspace_same_origin:$http_x_qsart_workspace" $workspace_request_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:1:1" 1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;
    root /usr/share/nginx/html;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    if ($workspace_host_allowed = 0) { return 403; }
    set $workspace_origin http://$http_host;
    set $workspace_same_origin 0;
    if ($http_origin = $workspace_origin) { set $workspace_same_origin 1; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qsart_api http://api:8000;
    proxy_connect_timeout 2s;
    proxy_read_timeout 90s;
    proxy_http_version 1.1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_redirect off;

    location = /api/model/info {
        if ($request_uri != /api/model/info) { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_read_timeout 5s;
        proxy_pass $qsart_api/model/info;
    }

    location = /api/portal/cases {
        if ($workspace_request_allowed = 0) { return 403; }
        client_max_body_size 13m;
        proxy_pass $qsart_api;
    }

    location ^~ /api/portal/ {
        if ($workspace_request_allowed = 0) { return 403; }
        proxy_pass $qsart_api;
    }

    location = /api { return 404; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
