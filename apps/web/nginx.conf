map $request_method $qsart_read_method {
    default 0;
    GET 1;
    HEAD 1;
}

map $request_uri $qsart_status_path {
    default 0;
    ~^/api/(health|ready)(\?.*)?$ 1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qsart_api http://api:8000;

    location ~ ^/api/(?<status_endpoint>health|ready)$ {
        if ($qsart_status_path = 0) { return 404; }
        if ($qsart_read_method = 0) { return 405; }
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass $qsart_api/$status_endpoint$is_args$args;
    }

    location = /api { return 404; }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
